<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    KIRA für Mac – App-Symbol, vereinfachte Fassung für 16 und 32 px
    (icon_16x16, icon_16x16@2x, icon_32x32). Ohne feine Glanzlichter, Kanten und
    Lichtbrechung; Glas fast deckend, Verlauf etwas satter für mehr Kontrast.
    Sprechblase (Kreis r 320 um 512,448) und K sind größer als in icon.svg, damit
    das K bei 32 px als klare Form steht: Versalhöhe 12 px, Stamm 3 px.
    Raster: 1 px bei 32 px = 32 Einheiten (bei 16 px = 64). Ränder der Blase, der
    Stamm (x 384–480) sowie Ober- und Unterkante des K (y 256–640) liegen auf ganzen
    Pixeln der 32-px-Fassung; bei 16 px bleiben Blasenränder, Ober-/Unterkante und
    linke Stammkante pixelgenau.
  -->
  <defs>
    <path id="body" d="M640.59 100C722.19 100 763 100 799.79 112.14L806.92 113.89C854.88 131.34 892.66 169.12 910.11 217.08L911.86 224.21C924 261 924 301.81 924 383.41L924 640.59C924 722.19 924 763 911.86 799.79L910.11 806.92C892.66 854.88 854.88 892.66 806.92 910.11L799.79 911.86C763 924 722.19 924 640.59 924L383.41 924C301.81 924 261 924 224.21 911.86L217.08 910.11C169.12 892.66 131.34 854.88 113.89 806.92L112.14 799.79C100 763 100 722.19 100 640.59L100 383.41C100 301.81 100 261 112.14 224.21L113.89 217.08C131.34 169.12 169.12 131.34 217.08 113.89L224.21 112.14C261 100 301.81 100 383.41 100Z"/>
    <path id="bubble" d="M192 448A320 320 0 1 1 512 768L336 768Q304 768 281.4 790.6L246.6 825.4Q192 880 192 802.7Z"/>
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="230.6" y1="24.6" x2="793.4" y2="999.4">
      <stop offset="0" stop-color="#7ddcfd"/>
      <stop offset="0.38" stop-color="#33b9f6"/>
      <stop offset="0.62" stop-color="#0ca0e2"/>
      <stop offset="1" stop-color="#0b4a7a"/>
    </linearGradient>
    <radialGradient id="gloss" gradientUnits="userSpaceOnUse" cx="347.2" cy="100" r="741.6"
      gradientTransform="translate(347.2 100) scale(1 0.6667) translate(-347.2 -100)">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" gradientUnits="userSpaceOnUse" x1="307" y1="192" x2="640" y2="781">
      <stop offset="0" stop-color="#fff" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#e0f4fe" stop-opacity="0.94"/>
    </linearGradient>
    <filter id="bodyShadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <use href="#body" fill="#021526" opacity="0.30" transform="translate(0 16)" filter="url(#bodyShadow)"/>
  <use href="#body" fill="url(#sky)"/>
  <use href="#body" fill="url(#gloss)"/>
  <use href="#bubble" fill="url(#glass)"/>
  <!-- K wie in icon.svg (Polygon mit gerundeten Ecken), hier ohne Glaseffekte. -->
  <path d="M400 256L464 256A16 16 0 0 1 480 272L480 361.53A12 12 0 0 0 501.46 368.91L584.74 262.16A16 16 0 0 1 597.36 256L671.22 256A16 16 0 0 1 683.84 281.84L568.63 429.53A12 12 0 0 0 568.22 443.73L686.63 614.9A16 16 0 0 1 673.48 640L593.32 640A16 16 0 0 1 580.16 633.1L501.87 519.94A12 12 0 0 0 480 526.76L480 624A16 16 0 0 1 464 640L400 640A16 16 0 0 1 384 624L384 272A16 16 0 0 1 400 256Z" fill="#0b5d96"/>
</svg>
