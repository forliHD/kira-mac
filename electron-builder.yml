# Paketierung „KIRA für Mac“ – electron-builder.
# Baut lokal auf dem Mac des Owners (kein CI). Signatur: Developer ID aus dem
# Schlüsselbund (CSC_NAME oder automatische Erkennung), Notarisierung über
# APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD und APPLE_TEAM_ID in der Umgebung.
appId: de.kira.mac
productName: KIRA
copyright: Copyright © 2026 Lucas Reiser
artifactName: ${productName}-${version}-${arch}.${ext}

directories:
  buildResources: build
  # Ausgabe außerhalb von iCloud: npm-Skript und release.sh überschreiben das
  # per -c.directories.output (Standard ~/Library/Caches/kira-mac/dist).
  output: dist

# Entfernt iCloud-/Finder-Metadaten vor dem Signieren (scripts/after-pack.cjs).
afterPack: scripts/after-pack.cjs

files:
  - out/**/*
  - package.json

# Der Swift-Helfer und das Menüleisten-Symbol liegen außerhalb des asar.
extraResources:
  - from: helper/.build/release/kira-helper
    to: helper/kira-helper
  - from: resources/tray
    to: tray

asar: true

# Härtung der ausgelieferten App (Electron-Fuses): kein ELECTRON_RUN_AS_NODE,
# keine NODE_OPTIONS, kein --inspect – sonst ließe sich über die signierte App
# fremder Code mit ihren Berechtigungen (Mikrofon, Bedienungshilfen) starten.
# Cookies (Cloudflare-Access-Sitzung) verschlüsselt auf der Platte, App-Code nur
# aus dem geprüften asar.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

# Nur Deutsch und Englisch: Electron bringt über 200 Sprachordner mit, jede
# Datei darin wird einzeln signiert (mit Apple-Zeitstempel). So bleibt die App
# kleiner, und das Signieren dauert Sekunden statt einer Viertelstunde.
# electron-builder vergleicht exakt bzw. per Präfix des Wunschs, deshalb stehen
# die Geschlechtsvarianten der Chromium-Ressourcen einzeln da.
electronLanguages:
  - de
  - de_FEMININE
  - de_MASCULINE
  - de_NEUTER
  - en
  - en_FEMININE
  - en_MASCULINE
  - en_NEUTER

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  # arch: [arm64, x64]  # x64 ergänzen, sobald Intel-Macs versorgt werden sollen
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  # macOS 14 ist das Mindestziel des Helfers (SFSpeechRecognizer-Rückfall);
  # Spracherkennung auf dem Apple-Chip und das Apple-Sprachmodell brauchen
  # macOS 26 auf Apple Silicon und melden sich darunter als nicht verfügbar.
  minimumSystemVersion: "14.0"
  # Nachgelagerte Binärdateien, die mit signiert werden müssen (Hardened Runtime,
  # Entitlements der App inkl. Mikrofon). Pfad relativ zum App-Bündel
  # (KIRA.app/…); ohne „Contents/“ fand codesign die Datei nicht (Build 02.10.).
  binaries:
    - Contents/Resources/helper/kira-helper
  extendInfo:
    NSMicrophoneUsageDescription: KIRA braucht das Mikrofon für das Diktat und für Besprechungsaufnahmen.
    NSSpeechRecognitionUsageDescription: KIRA erkennt Sprache auf diesem Mac, damit Diktate den Rechner nicht verlassen.
    NSAppleEventsUsageDescription: KIRA fügt diktierten Text in das vorderste Programm ein.
    LSApplicationCategoryType: public.app-category.productivity

dmg:
  sign: false
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

publish:
  provider: github
  owner: forliHD
  repo: kira-mac
  releaseType: release
